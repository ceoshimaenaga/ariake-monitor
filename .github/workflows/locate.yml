name: locate

# 各スポットの実際の位置を OpenStreetMap から取り、config.py の座標を直す。
# 手入力の座標は4桁しかなく、地図を拡大すると建物とマーカーがずれるため。

on:
  workflow_dispatch:
    inputs:
      patch:
        description: "config.py を書き換えてコミットする"
        type: boolean
        default: true
      fetch_names:
        description: "名前を取り直して basemap.json に貼り付ける"
        type: boolean
        default: false
      find:
        description: "この名前だけを引く (| 区切り)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate
        env:
          PATCH: ${{ inputs.patch }}
          FETCH: ${{ inputs.fetch_names }}
          FIND: ${{ inputs.find }}
        run: |
          ARGS=""
          [ -n "$FIND" ] && ARGS="$ARGS --find $FIND"
          [ "$FETCH" = "true" ] && ARGS="$ARGS --fetch-names"
          [ "$PATCH" = "true" ] && ARGS="$ARGS --patch"
          python ariake/locate.py $ARGS

      # 名前を取り直したときは、patch しなくても basemap.json を残す。
      # 取った名前を捨ててしまうと、名寄せを直すたびに取り直しになるため。
      - name: Commit config.py
        if: ${{ inputs.patch || inputs.fetch_names || inputs.find != '' }}
        run: |
          git config user.name "ariake-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ariake/config.py designs/basemap.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore(ariake): 座標と名前付き輪郭を更新する"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
