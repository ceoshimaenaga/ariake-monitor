name: pages

# 公開サイト (GitHub Pages) を組み立てて配信する。
# データ更新のたびに走るので、ページは常に最新の ariake.json を配る。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 立て続けに push すると、走っている最中のビルドが止められ、
  # 成果物が無いまま deploy 段だけが動いて失敗する (エラーメールが連続する)。
  # Pages は中断せず順に出すのが正しい。
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build _site
        run: python ariake/build_site.py

      # enablement: true は権限不足で落ちることがあり、Pages は既に
      # 設定画面で有効にしてあるので指定しない
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
