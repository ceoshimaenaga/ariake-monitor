name: pages

# 公開サイト (GitHub Pages) を組み立てて配信する。
# データ更新のたびに走るので、ページは常に最新の ariake.json を配る。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Pages は中断せず順に出す。中断すると配信済みの版が巻き戻りうる。
  cancel-in-progress: false

# 組み立てと配信を分ける。
# 同じジョブに入れると、アップロード直後の成果物を配信段が見つけられず
# 「No artifacts named github-pages」で落ちることがある。
# (実際に2回落ちた。GitHub 公式のテンプレートも2ジョブに分けている)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build _site
        run: python ariake/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
